<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceBio Explorer | NASA Space App</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/animacion.js" defer></script>
    <script src="JS/script.js" defer></script>
</head>

<body>
    <header>
        <div class="top-bar">
            <button class="hmb-button" aria-label="Menú">
                <div></div>
                <div></div>
                <div></div>
            </button>

            <section class="brand-section">
                <img src="public/logoSpace.jpg" alt="brand-img">
                <div class="brand-text">
                    <h1>Explore Space Biology Research</h1>
                    <h1>Search NASA Data about life in microgravity and space</h1>
                </div>
            </section>
        </div>

        <nav>
            <ul>
                <li><a href="#">Tema 1</a></li>
                <li><a href="#">Tema 2</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Explore Space Biology Research</h1>
        <input type="search" id="buscador" placeholder="Search a topic, organism, mission..."
            aria-label="Buscar estudios">
        <p id="contador"></p>
        <div id="resultados"></div>
    </main>

    <footer>
        <p>© 2026 SpaceBio Explorer · Proyecto para NASA Space Apps Challenge</p>
    </footer>
</body>

</html>
